# AF3x docs site: build on PRs, build + deploy to GitHub Pages on pushes to main.
# Pages source must be set to "GitHub Actions" (Settings → Pages).
name: AF3x docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/af3x_docs.yml']
  pull_request:
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/af3x_docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: af3x-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Pinned: MkDocs 2.0 breaks Material.
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.7.7
      - run: mkdocs build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
